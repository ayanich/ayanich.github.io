# The site is public, so GitHub's own secret scanning already covers it. This
# adds TruffleHog's verification pass on top, which catches credentials that
# GitHub's provider patterns miss -- and on a public repo a live credential is
# exposed the moment it lands.
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          extra_args: --results=verified,unknown
