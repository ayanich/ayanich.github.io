<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — page not found · Asher Yanich</title>
  <meta name="theme-color" content="#0b0d10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0d10; --text:#e6edf3; --dim:#9aa7b4; --accent:#7ee787; --link:#58a6ff; --border:#1f2a36; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      background-image:
        radial-gradient(1200px 600px at 80% -10%, rgba(88,166,255,0.08), transparent 60%),
        radial-gradient(800px 500px at -10% 10%, rgba(126,231,135,0.06), transparent 60%);
    }
    .wrap { text-align: center; padding: 24px; max-width: 560px; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .code { color: var(--accent); font-size: 14px; margin-bottom: 8px; }
    h1 { font-size: 88px; margin: 0 0 4px; letter-spacing: -0.04em; }
    p { color: var(--dim); margin: 0 0 22px; }
    a.btn {
      display: inline-block; padding: 10px 18px;
      border: 1px solid var(--accent); border-radius: 8px;
      color: var(--accent); text-decoration: none;
      font-family: "JetBrains Mono", monospace; font-size: 14px;
    }
    a.btn:hover { background: rgba(126,231,135,0.08); }
    .hint { margin-top: 28px; color: #6b7785; font-size: 13px; }
    .hint code { background: #141a21; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mono code">~ status: 404</div>
    <h1>404</h1>
    <p>That page doesn't exist (or got rerouted by an overzealous load balancer).</p>
    <a class="btn" href="/">$ cd ~</a>
    <div class="hint mono">try <code>/</code> for home</div>
  </div>
</body>
</html>
